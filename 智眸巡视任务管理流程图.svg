<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <!-- 深蓝背景渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#060e2b"/>
      <stop offset="100%" style="stop-color:#0a1940"/>
    </linearGradient>
    <!-- 左块渐变 -->
    <linearGradient id="leftGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d2a4a"/>
      <stop offset="100%" style="stop-color:#071828"/>
    </linearGradient>
    <!-- 中块渐变 -->
    <linearGradient id="midGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a0a"/>
      <stop offset="100%" style="stop-color:#0d0505"/>
    </linearGradient>
    <!-- 右块渐变 -->
    <linearGradient id="rightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1a2a"/>
      <stop offset="100%" style="stop-color:#060e1a"/>
    </linearGradient>
    <!-- 顶部3D面渐变 -->
    <linearGradient id="topLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a4a7a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d3060;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="topMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5a1a0a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#8a2a10;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="topRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a3050;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d2040;stop-opacity:1"/>
    </linearGradient>
    <!-- 发光效果 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="900" height="720" fill="url(#bgGrad)"/>

  <!-- 网格线装饰 -->
  <g stroke="#1a3a6a" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="300" x2="900" y2="300"/>
    <line x1="0" y1="400" x2="900" y2="400"/>
    <line x1="0" y1="500" x2="900" y2="500"/>
    <line x1="0" y1="600" x2="900" y2="600"/>
    <line x1="100" y1="0" x2="100" y2="720"/>
    <line x1="200" y1="0" x2="200" y2="720"/>
    <line x1="300" y1="0" x2="300" y2="720"/>
    <line x1="450" y1="0" x2="450" y2="720"/>
    <line x1="600" y1="0" x2="600" y2="720"/>
    <line x1="700" y1="0" x2="700" y2="720"/>
    <line x1="800" y1="0" x2="800" y2="720"/>
  </g>

  <!-- ===== 顶部标题 ===== -->
  <rect x="30" y="18" width="6" height="44" rx="3" fill="#00cfff" filter="url(#glow)"/>
  <text x="50" y="50" fill="white" font-size="28" font-weight="bold" letter-spacing="2">智眸——巡视任务管理</text>

  <!-- ===== 底部说明条 ===== -->
  <rect x="20" y="660" width="860" height="48" rx="6" fill="#0a2040" stroke="#00cfff" stroke-width="1" opacity="0.85"/>
  <text x="450" y="690" fill="white" font-size="17" font-weight="bold" text-anchor="middle" letter-spacing="3">
    实现线上线下高效协同，让巡视执行过程
    <tspan fill="#ffd700">标准化</tspan>
    <tspan fill="white"> · </tspan>
    <tspan fill="#ffd700">智能化</tspan>
    <tspan fill="white"> · </tspan>
    <tspan fill="#ffd700">可追溯</tspan>
  </text>

  <!-- ================================================================ -->
  <!-- 左列：移动端执行 -->
  <!-- ================================================================ -->
  <!-- 3D顶面 -->
  <polygon points="70,90  230,90  250,108  90,108" fill="url(#topLeft)" stroke="#2a6aaa" stroke-width="1"/>
  <!-- 右侧面 -->
  <polygon points="230,90  250,108  250,620  230,620" fill="#071525" stroke="#1a5080" stroke-width="1"/>
  <!-- 正面 -->
  <rect x="70" y="108" width="160" height="512" fill="url(#leftGrad)" stroke="#1a5a8a" stroke-width="1.5"/>

  <!-- 标题区 -->
  <rect x="70" y="108" width="160" height="52" fill="#0d3a6a" rx="0"/>
  <!-- 手机图标 -->
  <rect x="86" y="118" width="18" height="28" rx="3" fill="none" stroke="#00cfff" stroke-width="1.5"/>
  <circle cx="95" cy="141" r="2" fill="#00cfff"/>
  <text x="113" y="132" fill="#00cfff" font-size="13" font-weight="bold">移动端执行</text>

  <!-- 分隔线 -->
  <line x1="80" y1="160" x2="220" y2="160" stroke="#1a5a8a" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- 功能项1: 扫码签到 -->
  <rect x="82" y="170" width="146" height="88" rx="4" fill="#0a2a4a" stroke="#1a6aaa" stroke-width="1"/>
  <!-- 扫码图标 -->
  <rect x="92" y="179" width="14" height="14" rx="1" fill="none" stroke="#00cfff" stroke-width="1.5"/>
  <rect x="94" y="181" width="4" height="4" fill="#00cfff"/>
  <rect x="100" y="181" width="4" height="4" fill="#00cfff"/>
  <rect x="94" y="187" width="4" height="4" fill="#00cfff"/>
  <text x="112" y="192" fill="#00cfff" font-size="12" font-weight="bold">扫码签到</text>
  <text x="88" y="210" fill="#8ac8e8" font-size="10">APP/小程序端扫码签到</text>
  <text x="88" y="224" fill="#8ac8e8" font-size="10">确保巡视人员到岗到位</text>
  <text x="88" y="250" fill="#5a9abf" font-size="9">· 支持APP端与小程序端</text>

  <!-- 功能项2: 定位打卡 -->
  <rect x="82" y="268" width="146" height="88" rx="4" fill="#0a2a4a" stroke="#1a6aaa" stroke-width="1"/>
  <!-- 定位图标 -->
  <circle cx="97" cy="285" r="7" fill="none" stroke="#00cfff" stroke-width="1.5"/>
  <circle cx="97" cy="285" r="2.5" fill="#00cfff"/>
  <line x1="97" y1="292" x2="97" y2="298" stroke="#00cfff" stroke-width="1.5"/>
  <text x="112" y="290" fill="#00cfff" font-size="12" font-weight="bold">定位打卡</text>
  <text x="88" y="308" fill="#8ac8e8" font-size="10">GPS实时定位验证</text>
  <text x="88" y="322" fill="#8ac8e8" font-size="10">精确记录巡视轨迹</text>
  <text x="88" y="348" fill="#5a9abf" font-size="9">· 非指定点位自动预警</text>

  <!-- 功能项3: 影像留存 -->
  <rect x="82" y="366" width="146" height="88" rx="4" fill="#0a2a4a" stroke="#1a6aaa" stroke-width="1"/>
  <!-- 相机图标 -->
  <rect x="88" y="376" width="18" height="14" rx="2" fill="none" stroke="#00cfff" stroke-width="1.5"/>
  <circle cx="97" cy="383" r="3.5" fill="none" stroke="#00cfff" stroke-width="1"/>
  <rect x="100" y="374" width="6" height="3" rx="1" fill="#00cfff"/>
  <text x="112" y="388" fill="#00cfff" font-size="12" font-weight="bold">影像留存</text>
  <text x="88" y="406" fill="#8ac8e8" font-size="10">现场拍照同步上传</text>
  <text x="88" y="420" fill="#8ac8e8" font-size="10">佐证巡视真实到位</text>
  <text x="88" y="446" fill="#5a9abf" font-size="9">· 自动添加时间地点水印</text>

  <!-- ================================================================ -->
  <!-- 中列：AI辅助识别 -->
  <!-- ================================================================ -->
  <!-- 3D顶面 -->
  <polygon points="320,75  530,75  550,95  340,95" fill="url(#topMid)" stroke="#8a3a1a" stroke-width="1"/>
  <!-- 右侧面 -->
  <polygon points="530,75  550,95  550,630  530,630" fill="#1a0505" stroke="#6a2010" stroke-width="1"/>
  <!-- 正面 -->
  <rect x="320" y="95" width="210" height="535" fill="url(#midGrad)" stroke="#8a3a1a" stroke-width="1.5"/>

  <!-- 标题区 -->
  <rect x="320" y="95" width="210" height="52" fill="#3a1010" rx="0"/>
  <!-- AI脑图标 -->
  <ellipse cx="342" cy="122" rx="11" ry="9" fill="none" stroke="#ff6a30" stroke-width="1.5"/>
  <line x1="336" y1="118" x2="348" y2="118" stroke="#ff6a30" stroke-width="1"/>
  <line x1="334" y1="122" x2="350" y2="122" stroke="#ff6a30" stroke-width="1"/>
  <line x1="336" y1="126" x2="348" y2="126" stroke="#ff6a30" stroke-width="1"/>
  <text x="358" y="127" fill="#ff6a30" font-size="13" font-weight="bold">AI 辅助识别</text>

  <!-- 上传流程条 -->
  <rect x="330" y="157" width="190" height="38" rx="5" fill="#2a1010" stroke="#6a3010" stroke-width="1"/>
  <text x="425" y="173" fill="#ffaa60" font-size="11" text-anchor="middle">📷 拍照 / 录像上传</text>
  <!-- 箭头 -->
  <line x1="425" y1="195" x2="425" y2="212" stroke="#ff6a30" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="425" y="208" fill="#ff6a30" font-size="11" text-anchor="middle">→ 自动智能识别</text>

  <!-- 三个识别类型 -->
  <!-- 设备异常 -->
  <rect x="330" y="220" width="58" height="78" rx="4" fill="#1a2a10" stroke="#4a8a20" stroke-width="1.5"/>
  <text x="359" y="240" fill="#6adf30" font-size="10" font-weight="bold" text-anchor="middle">设备异常</text>
  <line x1="335" y1="246" x2="383" y2="246" stroke="#4a8a20" stroke-width="0.8"/>
  <text x="359" y="260" fill="#8ac870" font-size="9" text-anchor="middle">异响/破损</text>
  <text x="359" y="272" fill="#8ac870" font-size="9" text-anchor="middle">参数异常</text>

  <!-- 安全隐患（高亮橙色） -->
  <rect x="396" y="220" width="58" height="78" rx="4" fill="#3a1a0a" stroke="#cc5510" stroke-width="2"/>
  <text x="425" y="240" fill="#ff8844" font-size="10" font-weight="bold" text-anchor="middle">安全隐患</text>
  <line x1="401" y1="246" x2="449" y2="246" stroke="#cc5510" stroke-width="0.8"/>
  <text x="425" y="260" fill="#ffaa88" font-size="9" text-anchor="middle">消防缺失</text>
  <text x="425" y="272" fill="#ffaa88" font-size="9" text-anchor="middle">违规堆放</text>

  <!-- 合规问题 -->
  <rect x="462" y="220" width="58" height="78" rx="4" fill="#0a1a3a" stroke="#4a5aaa" stroke-width="1.5"/>
  <text x="491" y="240" fill="#7a9aff" font-size="10" font-weight="bold" text-anchor="middle">合规问题</text>
  <line x1="467" y1="246" x2="515" y2="246" stroke="#4a5aaa" stroke-width="0.8"/>
  <text x="491" y="260" fill="#aabcff" font-size="9" text-anchor="middle">标识不</text>
  <text x="491" y="272" fill="#aabcff" font-size="9" text-anchor="middle">规范等</text>

  <!-- 行业模型条 -->
  <rect x="330" y="310" width="190" height="30" rx="4" fill="#1a1010" stroke="#5a3a20" stroke-width="1"/>
  <text x="425" y="330" fill="#cc8844" font-size="10" text-anchor="middle">⚙ 内置行业专属模型 · 识别准确率可配置优化</text>

  <!-- 行业模型标签 -->
  <rect x="330" y="350" width="58" height="26" rx="4" fill="#0a1a30" stroke="#2a5a80" stroke-width="1"/>
  <text x="359" y="367" fill="#60b0ff" font-size="10" text-anchor="middle">⚡ 电力设备</text>

  <rect x="396" y="350" width="58" height="26" rx="4" fill="#0a1a30" stroke="#2a5a80" stroke-width="1"/>
  <text x="425" y="367" fill="#60b0ff" font-size="10" text-anchor="middle">🏭 制造车间</text>

  <rect x="462" y="350" width="58" height="26" rx="4" fill="#0a1a30" stroke="#2a5a80" stroke-width="1"/>
  <text x="491" y="367" fill="#60b0ff" font-size="10" text-anchor="middle">🏢 办公区域</text>

  <!-- 算法模型库说明 -->
  <rect x="330" y="390" width="190" height="100" rx="4" fill="#150808" stroke="#5a2a10" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="425" y="410" fill="#cc6633" font-size="11" font-weight="bold" text-anchor="middle">算法模型库</text>
  <line x1="335" y1="415" x2="515" y2="415" stroke="#5a2a10" stroke-width="0.8"/>
  <text x="335" y="430" fill="#aa7755" font-size="9">· 积水识别 / 火焰识别 / 烟雾识别</text>
  <text x="335" y="445" fill="#aa7755" font-size="9">· 安全帽识别 / 安全绳识别</text>
  <text x="335" y="460" fill="#aa7755" font-size="9">· 人员合规融合识别</text>
  <text x="335" y="475" fill="#aa7755" font-size="9">· 跑冒滴漏识别 / 第三方算法API</text>

  <!-- 实时分析引擎 -->
  <rect x="330" y="502" width="190" height="50" rx="4" fill="#0a1a10" stroke="#2a6a30" stroke-width="1"/>
  <text x="425" y="522" fill="#44cc66" font-size="11" font-weight="bold" text-anchor="middle">🔄 实时分析引擎</text>
  <text x="425" y="540" fill="#7aaa88" font-size="9" text-anchor="middle">逐帧/抽帧解码 · 结构化告警推送</text>

  <!-- 图像增强 -->
  <rect x="330" y="562" width="90" height="40" rx="4" fill="#0a1520" stroke="#2a4a60" stroke-width="1"/>
  <text x="375" y="578" fill="#60a0cc" font-size="9" text-anchor="middle">🌟 图像增强</text>
  <text x="375" y="592" fill="#4a7a9a" font-size="9" text-anchor="middle">预处理优化</text>

  <!-- 人工复核 -->
  <rect x="430" y="562" width="90" height="40" rx="4" fill="#0a1520" stroke="#2a4a60" stroke-width="1"/>
  <text x="475" y="578" fill="#60a0cc" font-size="9" text-anchor="middle">👁 人工复核</text>
  <text x="475" y="592" fill="#4a7a9a" font-size="9" text-anchor="middle">判定确认</text>

  <!-- ================================================================ -->
  <!-- 右列：标准化记录 -->
  <!-- ================================================================ -->
  <!-- 3D顶面 -->
  <polygon points="620,90  800,90  820,108  640,108" fill="url(#topRight)" stroke="#2a5a80" stroke-width="1"/>
  <!-- 右侧面 -->
  <polygon points="800,90  820,108  820,620  800,620" fill="#050d18" stroke="#1a4060" stroke-width="1"/>
  <!-- 正面 -->
  <rect x="620" y="108" width="180" height="512" fill="url(#rightGrad)" stroke="#1a4a70" stroke-width="1.5"/>

  <!-- 标题区 -->
  <rect x="620" y="108" width="180" height="52" fill="#0a2a45" rx="0"/>
  <!-- 列表图标 -->
  <rect x="634" y="116" width="16" height="20" rx="2" fill="none" stroke="#00cfff" stroke-width="1.5"/>
  <line x1="637" y1="122" x2="647" y2="122" stroke="#00cfff" stroke-width="1"/>
  <line x1="637" y1="127" x2="647" y2="127" stroke="#00cfff" stroke-width="1"/>
  <line x1="637" y1="132" x2="647" y2="132" stroke="#00cfff" stroke-width="1"/>
  <text x="657" y="130" fill="#00cfff" font-size="13" font-weight="bold">标准化记录</text>

  <line x1="630" y1="160" x2="790" y2="160" stroke="#1a5a8a" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- 功能项1: 预设问题选项 -->
  <rect x="632" y="170" width="156" height="88" rx="4" fill="#0a2040" stroke="#1a5080" stroke-width="1"/>
  <rect x="641" y="179" width="10" height="10" rx="2" fill="#00cfff" opacity="0.8"/>
  <text x="658" y="189" fill="#00cfff" font-size="12" font-weight="bold">预设问题选项</text>
  <text x="638" y="207" fill="#8ac8e8" font-size="10">单选/多选灵活配置</text>
  <text x="638" y="221" fill="#8ac8e8" font-size="10">标准化采集流程</text>
  <text x="638" y="247" fill="#5a9abf" font-size="9">· 避免人工记录不规范</text>

  <!-- 功能项2: 自定义备注栏 -->
  <rect x="632" y="268" width="156" height="88" rx="4" fill="#0a2040" stroke="#1a5080" stroke-width="1"/>
  <rect x="641" y="277" width="16" height="12" rx="1" fill="none" stroke="#00cfff" stroke-width="1.5"/>
  <line x1="643" y1="281" x2="655" y2="281" stroke="#00cfff" stroke-width="1"/>
  <line x1="643" y1="285" x2="655" y2="285" stroke="#00cfff" stroke-width="1"/>
  <text x="663" y="287" fill="#00cfff" font-size="12" font-weight="bold">自定义备注栏</text>
  <text x="638" y="305" fill="#8ac8e8" font-size="10">补充特殊情况说明</text>
  <text x="638" y="319" fill="#8ac8e8" font-size="10">灵活扩展记录内容</text>
  <text x="638" y="345" fill="#5a9abf" font-size="9">· 支持语音快速录入</text>

  <!-- 功能项3: 现场照片上传 -->
  <rect x="632" y="366" width="156" height="88" rx="4" fill="#0a2040" stroke="#1a5080" stroke-width="1"/>
  <rect x="636" y="374" width="18" height="14" rx="2" fill="none" stroke="#00cfff" stroke-width="1.5"/>
  <circle cx="645" cy="381" r="3.5" fill="none" stroke="#00cfff" stroke-width="1"/>
  <text x="661" y="386" fill="#00cfff" font-size="12" font-weight="bold">现场照片上传</text>
  <text x="638" y="404" fill="#8ac8e8" font-size="10">拍照上传作为佐证</text>
  <text x="638" y="418" fill="#8ac8e8" font-size="10">确保记录真实可信</text>
  <text x="638" y="444" fill="#5a9abf" font-size="9">· 自动添加时间地点水印</text>

  <!-- 功能项4: 视频留存佐证 -->
  <rect x="632" y="464" width="156" height="88" rx="4" fill="#0a2040" stroke="#1a5080" stroke-width="1"/>
  <rect x="636" y="472" width="18" height="13" rx="2" fill="none" stroke="#00cfff" stroke-width="1.5"/>
  <polygon points="654,472 654,485 664,478" fill="#00cfff"/>
  <text x="670" y="483" fill="#00cfff" font-size="12" font-weight="bold">视频留存佐证</text>
  <text x="638" y="500" fill="#8ac8e8" font-size="10">录像上传支持回放</text>
  <text x="638" y="514" fill="#8ac8e8" font-size="10">杜绝人工记录不规范</text>
  <text x="638" y="540" fill="#5a9abf" font-size="9">· 前后10秒短视频复核</text>

  <!-- ================================================================ -->
  <!-- 连接箭头（三列之间） -->
  <!-- ================================================================ -->
  <!-- 左→中 箭头 -->
  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#00cfff"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ff6a30"/>
    </marker>
  </defs>
  <line x1="250" y1="365" x2="318" y2="365" stroke="#00cfff" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowBlue)" filter="url(#glow)"/>

  <!-- 中→右 箭头 -->
  <line x1="550" y1="365" x2="618" y2="365" stroke="#00cfff" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowBlue)" filter="url(#glow)"/>

  <!-- 箭头标签 -->
  <rect x="256" y="352" width="56" height="18" rx="3" fill="#0a1a30" opacity="0.9"/>
  <text x="284" y="365" fill="#00cfff" font-size="9" text-anchor="middle">数据上传</text>

  <rect x="556" y="352" width="56" height="18" rx="3" fill="#0a1a30" opacity="0.9"/>
  <text x="584" y="365" fill="#00cfff" font-size="9" text-anchor="middle">记录归档</text>

</svg>
